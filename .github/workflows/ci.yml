name: CI

on:
  push:
  pull_request:

jobs:
  validate-data:
    name: Validate data tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 tools/validate_data.py
      - run: python3 tools/test_knowledge_glossary.py
      - name: Validate independent village content and negative tests
        run: python3 "Castles and Cities/tools/verify_village_source.py" --phase data --out /tmp/village-data
      - name: Preserve village data evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-data-evidence
          path: /tmp/village-data

  headless-tests:
    name: Headless engine tests
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -o ~/godot/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: Import project (builds the global class cache)
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --import 2>&1 | tee /tmp/godot-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/godot-import.log
      - name: Run test suite
        run: |
          set -o pipefail
          ~/godot/godot --headless --path . --script res://tests/run_tests.gd 2>&1 | tee /tmp/godot-tests.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' /tmp/godot-tests.log
      - name: Run independent village import and all headless suites
        if: ${{ !cancelled() }}
        run: python3 "Castles and Cities/tools/verify_village_source.py" --godot ~/godot/godot --phase headless --out /tmp/village-headless
      - name: Preserve parent engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parent-engine-evidence
          path: |
            /tmp/godot-import.log
            /tmp/godot-tests.log
      - name: Preserve village headless evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-headless-evidence
          path: /tmp/village-headless
