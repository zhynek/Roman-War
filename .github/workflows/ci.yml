name: CI

on:
  # `pull_request` (never `pull_request_target`): fork PRs run against the
  # merge commit with a read-only token and no access to repository secrets.
  pull_request:
  # Only `main` on push — every other branch gets its CI from its pull request,
  # so this does not run the whole suite twice for every branch push.
  push:
    branches: [main]

# Least privilege. Nothing in this workflow writes to the repository, so the
# GITHUB_TOKEN handed to a pull request from a fork can do nothing but read.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    name: Validate data tables
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python3 tools/validate_data.py

  headless-tests:
    name: Headless engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: 4.4.1
      # SHA-512 of Godot_v4.4.1-stable_linux.x86_64.zip exactly as published by
      # the Godot project in that release's SHA512-SUMS.txt. Bump both together.
      # The archive is verified on every run — including a cache hit — so a
      # corrupted download or a tampered cache entry fails the job instead of
      # silently running an unknown binary.
      GODOT_SHA512: ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Godot archive
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-cache
          curl -fsSL --retry 3 -o ~/godot-cache/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"

      - name: Verify and unpack Godot
        run: |
          set -euo pipefail
          echo "${GODOT_SHA512}  ${HOME}/godot-cache/godot.zip" | sha512sum --check --strict
          mkdir -p ~/godot
          unzip -oq ~/godot-cache/godot.zip -d ~/godot
          mv -f ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          ~/godot/godot --version

      - name: Import project (builds the global class cache)
        run: ~/godot/godot --headless --path . --import || true

      - name: Run test suite
        run: ~/godot/godot --headless --path . --script res://tests/run_tests.gd
